<style>
html:not(.fora-do-ar) #fora-do-ar{display:none!important}
html.fora-do-ar body>*:not(#fora-do-ar){display:none!important}
html.fora-do-ar,html.fora-do-ar body{margin:0;height:100%;background:#0b0920;overflow:hidden}
html.fora-do-ar #fora-do-ar{display:grid;place-items:center;position:fixed;inset:0;z-index:2147483647;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f4ecff;
  background:radial-gradient(ellipse at 50% 45%,#2a1d5c 0%,#160f38 45%,#0b0920 100%);text-align:center;padding:24px;box-sizing:border-box}
#fora-do-ar::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);animation:fda-scan 8s linear infinite}
#fora-do-ar::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.fda-box{position:relative;z-index:1}
.fda-num{position:relative;font-weight:900;font-size:clamp(96px,24vw,260px);line-height:.9;letter-spacing:.04em;color:#fdf3ff;text-shadow:0 0 18px rgba(255,200,255,.35);animation:fda-tremor 3.2s infinite steps(1)}
.fda-num::before,.fda-num::after{content:attr(data-t);position:absolute;inset:0;mix-blend-mode:screen}
.fda-num::before{color:#22d3ee;animation:fda-rgb1 2.4s infinite linear alternate-reverse}
.fda-num::after{color:#ff2e88;animation:fda-rgb2 1.9s infinite linear alternate-reverse}
.fda-sub{position:relative;margin-top:18px;font-weight:800;font-size:clamp(26px,5.4vw,58px);color:#f6e6ff;text-shadow:3px 0 0 rgba(255,46,136,.75),-3px 0 0 rgba(34,211,238,.75);animation:fda-tremor 4.1s infinite steps(1) .4s}
.fda-txt{margin:18px auto 0;max-width:520px;font-size:clamp(14px,2.2vw,17px);line-height:1.5;color:#c9bde8;opacity:.9}
.fda-btn{margin-top:26px;display:inline-block;padding:11px 22px;border-radius:999px;border:1px solid rgba(244,236,255,.35);color:#f4ecff;background:rgba(255,255,255,.06);font:inherit;font-weight:600;cursor:pointer}
.fda-btn:hover{background:rgba(255,255,255,.12)}
.fda-risco{position:absolute;height:2px;border-radius:2px;opacity:.85;animation:fda-risco 3.5s ease-in-out infinite}
@keyframes fda-scan{to{background-position:0 400px}}
@keyframes fda-rgb1{0%{clip-path:inset(12% 0 70% 0);transform:translate(-6px,-2px)}20%{clip-path:inset(60% 0 8% 0);transform:translate(5px,1px)}40%{clip-path:inset(35% 0 40% 0);transform:translate(-3px,2px)}60%{clip-path:inset(80% 0 2% 0);transform:translate(6px,-1px)}80%{clip-path:inset(5% 0 82% 0);transform:translate(-5px,1px)}100%{clip-path:inset(45% 0 30% 0);transform:translate(3px,0)}}
@keyframes fda-rgb2{0%{clip-path:inset(70% 0 10% 0);transform:translate(6px,1px)}25%{clip-path:inset(10% 0 75% 0);transform:translate(-6px,-1px)}50%{clip-path:inset(42% 0 33% 0);transform:translate(4px,2px)}75%{clip-path:inset(85% 0 3% 0);transform:translate(-4px,0)}100%{clip-path:inset(25% 0 55% 0);transform:translate(5px,-2px)}}
@keyframes fda-tremor{0%,86%,100%{transform:none;filter:none}88%{transform:translate(-4px,1px) skewX(-6deg);filter:blur(.6px)}90%{transform:translate(5px,-1px)}92%{transform:translate(-2px,0) skewX(4deg)}94%{transform:none;opacity:.75}96%{opacity:1}}
@keyframes fda-risco{0%,100%{transform:translateX(-30px) scaleX(.6);opacity:0}30%{opacity:.9}50%{transform:translateX(30px) scaleX(1)}70%{opacity:.6}}
@media (prefers-reduced-motion:reduce){#fora-do-ar *,#fora-do-ar::before{animation:none!important}}
</style>
<div id="fora-do-ar" role="alert" aria-live="assertive">
  <div class="fda-box">
    <span class="fda-risco" style="width:46%;left:-6%;top:22%;background:linear-gradient(90deg,transparent,#22d3ee,#ff2e88,transparent)"></span>
    <span class="fda-risco" style="width:38%;right:-4%;top:62%;background:linear-gradient(90deg,transparent,#ff2e88,transparent);animation-delay:1.2s"></span>
    <span class="fda-risco" style="width:30%;left:10%;bottom:-8%;background:linear-gradient(90deg,transparent,#22d3ee,transparent);animation-delay:.6s"></span>
    <div class="fda-num" data-t="404">404</div>
    <div class="fda-sub">Página não encontrada</div>
    <p class="fda-txt">O endereço que você tentou acessar não está disponível no momento.</p>
    <button class="fda-btn" type="button" onclick="location.reload()">Tentar novamente</button>
  </div>
</div>
<script>
// Com o site "fora do ar", só o administrador entra: pelo link com ?adm (ou neste aparelho, depois de entrar como administrador uma vez)
if (window.SITE_FORA_DO_AR) {
  var livre = /[?#&]adm\b/.test(location.search + location.hash); try { livre = livre || localStorage.getItem('exh-adm-livre') === '1'; } catch (e) {}
  window.SITE_ADM_LIVRE = livre;
  if (!livre) { document.documentElement.classList.add('fora-do-ar'); document.title = 'Página não encontrada'; }
}
</script>
